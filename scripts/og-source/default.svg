<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0A1018"/>
  
  <!-- Hairline grid texture (subtle) -->
  <defs>
    <pattern id="grid" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1E2A3A" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.4"/>
  
  <!-- Signed Stroke mark (scaled up 2x from 120x64 viewBox) -->
  <g transform="translate(80, 460) scale(2.5)">
    <path d="M8 44 C 20 8, 36 10, 30 30 C 26 42, 14 46, 15 38 C 16 28, 40 20, 56 26 C 64 29, 70 32, 78 32" stroke="#4DA6FF" stroke-width="3.5" fill="none"/>
    <rect x="84" y="27" width="6" height="6" fill="#4DA6FF"/>
    <rect x="93" y="23" width="5" height="5" fill="#4DA6FF"/>
    <rect x="101" y="19" width="4" height="4" fill="#4DA6FF"/>
  </g>
  
  <!-- Horizontal rule -->
  <line x1="80" y1="120" x2="1120" y2="120" stroke="#1E2A3A" stroke-width="1"/>
  
  <!-- Eyebrow -->
  <text x="80" y="100" font-family="Hanken Grotesk, system-ui, sans-serif" font-size="14" font-weight="500" letter-spacing="3" fill="#93A0AD">OPEN STAY PASS · SIGNED CREDENTIAL</text>
  
  <!-- Headline -->
  <text x="80" y="230" font-family="Hanken Grotesk, system-ui, sans-serif" font-size="72" font-weight="800" fill="#F2F0E9" letter-spacing="-2">Guests should not need</text>
  <text x="80" y="320" font-family="Hanken Grotesk, system-ui, sans-serif" font-size="72" font-weight="800" fill="#F2F0E9" letter-spacing="-2">six apps to arrive.</text>
  
  <!-- Subhead -->
  <text x="80" y="390" font-family="Hanken Grotesk, system-ui, sans-serif" font-size="24" font-weight="400" fill="#93A0AD">One signed, revocable link. QR · NFC · HostCasa arrival · Folios handoff.</text>
  
  <!-- URL -->
  <text x="80" y="590" font-family="Hanken Grotesk, system-ui, sans-serif" font-size="16" font-weight="500" fill="#4DA6FF">staypass.dev</text>
  
  <!-- MIT badge -->
  <rect x="1040" y="70" width="80" height="26" fill="none" stroke="#1E2A3A" stroke-width="1"/>
  <text x="1080" y="87" font-family="Hanken Grotesk, system-ui, sans-serif" font-size="12" font-weight="700" fill="#93A0AD" text-anchor="middle">MIT</text>
</svg>
